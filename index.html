<!DOCTYPE html>
<html>

<head>
    <title>MindBalance AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧠 MindBalance AI</h1>
        <p>Productivity + Burnout Intelligence System</p>
    </header>

    <div class="container">

        <!-- LEFT: TASKS -->
        <div class="panel">
            <h2>📋 Tasks</h2>

            <input type="text" id="taskInput" placeholder="Enter task">
            <button onclick="addTask()">Add</button>

            <ul id="taskList"></ul>
        </div>

        <!-- RIGHT: BURNOUT -->
        <div class="panel">
            <h2>🧠 Burnout Tracker</h2>

            <label>Mood:</label>
            <select id="mood">
                <option>Happy</option>
                <option>Neutral</option>
                <option>Stressed</option>
            </select>

            <br><br>

            <label>Study Hours:</label>
            <input type="number" id="hours">

            <br><br>

            <button onclick="analyze()">Analyze</button>

            <p id="result"></p>
        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
